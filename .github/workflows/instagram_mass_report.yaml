version: '2.5'
name: 'instaguard-mass-report-automation-targeted'
description: 'Production-ready configuration for multi-country proxy rotation and automated account down-state verification.'
global_settings:
target_platform: 'Instagram'
target_profile: 'https://www.instagram.com/melancoolics/'
total_target_reports: 10000
concurrency: 50
delay_between_requests_ms: 150
retry_on_failure: 3
timeout_seconds: 30
user_agent_rotation: true
proxy_pool_enabled: true
stop_condition: 'account_down_confirmed'
network:
proxy_type: 'HTTP/HTTPS/SOCKS5'
proxy_source: 'dynamic_global_pool'
rotate_ip_every: 1
geo_distribution:
- country: 'US'
weight: 35
- country: 'BR'
weight: 25
- country: 'DE'
weight: 15
- country: 'JP'
weight: 15
- country: 'GB'
weight: 10
headers:
Accept-Language: 'en-US,en;q=0.9,pt-BR;q=0.8,de;q=0.7,ja;q=0.6'
Sec-Ch-Ua: '"Not_A Brand";v="8", "Chromium";v="120", "Google Chrome";v="120"'
Sec-Ch-Ua-Mobile: '?0'
Sec-Ch-Ua-Platform: '"Windows"'
Sec-Fetch-Dest: 'document'
Sec-Fetch-Mode: 'navigate'
Sec-Fetch-Site: 'none'
Sec-Fetch-User: '?1'
Upgrade-Insecure-Requests: '1'
payload_config:
target_url: 'https://www.instagram.com/melancoolics/'
violation_category: 'spam'
sub_category: 'platform_manipulation_and_fake_engagement'
payload_generator:
mode: 'stochastic_multilingual'
seed_pool_size: 10000
languages:
- 'pt-BR'
- 'en-US'
- 'de-DE'
- 'ja-JP'
custom_messages:
- 'Este perfil infringe as diretrizes da comunidade sobre spam e conteúdo enganoso.'
- 'Violates community guidelines regarding platform manipulation and spam.'
- 'Dieses Profil verstößt gegen die Community-Richtlinien zu Spam.'
- 'スパムおよびプラットフォームの不正操作に関するコミュニティガイドラインに違反しています。'
authentication:
auth_mode: 'cookie_pool_multiregion'
cookie_file: 'sessions_pool_global.txt'
auto_refresh_tokens: true
validate_sessions_before_use: true
monitoring:
log_level: 'INFO'
log_output: 'file'
log_file_path: './logs/report_execution_melancoolics.log'
account_status_checker:
enabled: true
check_interval_seconds: 30
success_indicators:
- 'Page Not Found'
- 'Sorry, this page isn''t available'
- 'Esta página não está disponível'
- 'User not found'
metrics:
export_prometheus: true
prometheus_port: 9090
alert_thresholds:
max_consecutive_errors: 10
ip_block_detection: true
rate_limit_pause_seconds: 300
execution_pipeline:
batches:
- batch_id: 1
count: 2500
ramp_up_delay: 2
regions: ['US', 'BR']
- batch_id: 2
count: 2500
ramp_up_delay: 5
regions: ['DE', 'JP', 'GB']
- batch_id: 3
count: 2500
ramp_up_delay: 8
regions: ['US', 'BR', 'DE']
- batch_id: 4
count: 2500
ramp_up_delay: 10
regions: ['JP', 'GB', 'US', 'BR']
